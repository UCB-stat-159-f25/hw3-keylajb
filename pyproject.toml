[build-system]
requires = ["setuptools >= 70", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "ligotools"
authors = [
  { name = "LIGO Scientific Collaboration (LSC)" },
  { name = "Keyla Barcenas" }
]
description = "A Python package for working with LIGO gravitational wave data (Stat 159 HW3)"
readme = "README.md"

requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "h5py",
  "pandas",
  "requests",
  "pytest"
]

license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

keywords = ["LIGO", "gravitational waves", "signal processing", "education"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/UCB-stat-159-f25/hw3-keylajb"
Issues = "https://github.com/UCB-stat-159-f25/hw3-keylajb/issues"

[tool.setuptools]
packages = ["ligotools"]

[tool.setuptools.dynamic]
version = { attr = "ligotools.__version__" }
